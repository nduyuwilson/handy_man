plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.nduyuwilson.thitima'
    compileSdk 36

    defaultConfig {
        applicationId "com.nduyuwilson.thitima"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.splashscreen
    
    // Room
    implementation libs.room.runtime
    implementation libs.work.runtime
    annotationProcessor libs.room.compiler
    
    // Lifecycle
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    
    // Navigation
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    
    // Glide
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    
    // JSON
    implementation libs.gson

    // Firebase - Auth + Firestore (for subscription check)
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // WorkManager for periodic online subscription check
    implementation 'androidx.work:work-runtime:2.9.0'
    // Guava Android: provides ListenableFuture required by WorkManager 2.9+ in Java projects
    implementation 'com.google.guava:guava:32.1.3-android'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}